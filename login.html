
<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | SecureFence</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="icon" type="image/png" href="Securelogo-removebg-preview.png">

<style>
:root {
    --body-bg: #F5F6F8;
    --card-bg: #FFFFFF;
    --text-color: #263246;
    --heading-color: #101D35;
    --paragraph-color: #737D8D;
    --border-color: #E2E5EB;
    --input-bg: #FFFFFF;
    --primary-color: #D4AF37;
    --primary-hover: #B89428;
    --navy-color: #101D35;
    --transition: all 0.3s ease;
    --shadow: 0 8px 30px rgba(16,29,53,0.10);
}

[data-theme="dark"] {
    --body-bg: #0B1220;
    --card-bg: #131F33;
    --text-color: #E6EAF0;
    --heading-color: #F5F6F8;
    --paragraph-color: #A7B0C0;
    --border-color: #344158;
    --input-bg: #0B1220;
    --primary-color: #D4AF37;
    --primary-hover: #E5C65C;
    --shadow: 0 8px 30px rgba(0,0,0,0.25);
}

/* GLOBAL: PREVENT PAGE SCROLLING */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: var(--body-bg);
    color: var(--text-color);
    transition: var(--transition);
}

/* TOP CONTROLS */

.top-controls {
    position: fixed;
    top: 15px;
    right: 20px;
    display: flex;
    gap: 8px;
    z-index: 10;
}

.control-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 8px 12px;
    background: var(--card-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: var(--transition);
}

.control-btn:hover {
    border-color: var(--primary-color);
    color: var(--primary-hover);
}

/* PAGE LAYOUT */

.login-section {
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: 58px 16px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* LOGIN CARD */

.login-card {
    width: 100%;
    max-width: 420px;
    max-height: 100%;
    padding: 24px 34px 22px;
    position: relative;
    overflow: hidden;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    box-shadow: var(--shadow);
    flex-shrink: 1;
}

.login-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(
        90deg,
        #B89428,
        #F1D77A,
        #D4AF37,
        #101D35
    );
}

/* LOGO IMAGE */

.brand {
    text-align: center;
    margin-bottom: 16px;
}

.brand-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 5px;
}

.brand-logo img {
    display: block;
    width: 180px;
    height: 65px;
    object-fit: contain;
    object-position: center;
}

.brand p {
    color: var(--paragraph-color);
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
}

/* HEADING */

.login-heading {
    text-align: center;
    margin-bottom: 20px;
}

.login-heading h1 {
    color: var(--heading-color);
    font-size: 26px;
    margin-bottom: 7px;
}

.login-heading p {
    color: var(--paragraph-color);
    font-size: 12px;
    line-height: 1.5;
}

/* FORM FIELDS */

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    color: var(--heading-color);
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 7px;
}

.input-wrapper {
    position: relative;
}

.input-wrapper input {
    width: 100%;
    height: 43px;
    padding: 0 42px 0 13px;
    background: var(--input-bg);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 5px;
    outline: none;
    font-family: Arial, sans-serif;
    font-size: 12px;
    transition: var(--transition);
}

.input-wrapper input::placeholder {
    color: var(--paragraph-color);
    opacity: 0.85;
}

.input-wrapper input:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(212,175,55,0.13);
}

.password-toggle {
    position: absolute;
    top: 50%;
    right: 12px;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: var(--paragraph-color);
    font-size: 14px;
    cursor: pointer;
    padding: 5px;
}

/* FORGOT PASSWORD */

.forgot-row {
    display: flex;
    justify-content: flex-end;
    margin-top: -5px;
    margin-bottom: 15px;
}

.forgot-row a {
    color: var(--primary-hover);
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
}

.forgot-row a:hover,
.signup-text a:hover {
    text-decoration: underline;
}

/* SIGN IN */

.signin-btn {
    width: 100%;
    min-height: 44px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(100deg, #D4AF37, #E8CA68);
    color: #101D35;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}

.signin-btn i {
    margin-right: 8px;
}

.signin-btn:hover {
    background: linear-gradient(100deg, #B89428, #D4AF37);
    transform: translateY(-1px);
    box-shadow: 0 5px 16px rgba(184,148,40,0.22);
}

/* DIVIDER */

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 17px 0 13px;
    color: var(--paragraph-color);
    font-size: 11px;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border-color);
}

/* SOCIAL LOGIN */

.social-login {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.social-btn {
    height: 38px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-color);
    border-radius: 5px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: var(--transition);
}

.social-btn:hover {
    border-color: var(--primary-color);
    background: var(--body-bg);
}

.google-icon {
    color: #4285F4;
    font-size: 15px;
}

.apple-icon {
    color: var(--text-color);
    font-size: 16px;
}

/* SIGN UP */

.signup-text {
    text-align: center;
    margin-top: 17px;
    color: var(--paragraph-color);
    font-size: 11px;
}

.signup-text a {
    color: var(--primary-hover);
    text-decoration: none;
    font-weight: 700;
    margin-left: 5px;
}

/* RTL SUPPORT */

[dir="rtl"] .top-controls {
    right: auto;
    left: 20px;
}

[dir="rtl"] .input-wrapper input {
    padding: 0 13px 0 42px;
    text-align: right;
}

[dir="rtl"] .password-toggle {
    right: auto;
    left: 12px;
}

[dir="rtl"] .forgot-row {
    justify-content: flex-start;
}

[dir="rtl"] .signin-btn i {
    margin-right: 0;
    margin-left: 8px;
}

[dir="rtl"] .signup-text a {
    margin-left: 0;
    margin-right: 5px;
}

/* SMALL SCREENS */

@media (max-width: 480px) {
    .top-controls {
        top: 10px;
        right: 10px;
        gap: 6px;
    }

    [dir="rtl"] .top-controls {
        right: auto;
        left: 10px;
    }

    .control-btn {
        padding: 7px 9px;
        font-size: 11px;
    }

    .login-section {
        padding: 54px 12px 12px;
    }

    .login-card {
        padding: 20px 20px 18px;
    }

    .brand-logo img {
        width: 155px;
        height: 55px;
    }

    .login-heading h1 {
        font-size: 24px;
    }
}

/* SHORT DESKTOP / MOBILE LANDSCAPE */

@media (max-height: 650px) {
    .login-section {
        padding-top: 48px;
        padding-bottom: 8px;
    }

    .login-card {
        padding: 14px 28px 12px;
    }

    .brand {
        margin-bottom: 8px;
    }

    .brand-logo img {
        height: 43px;
    }

    .brand p {
        font-size: 10px;
    }

    .login-heading {
        margin-bottom: 12px;
    }

    .login-heading h1 {
        font-size: 22px;
        margin-bottom: 4px;
    }

    .form-group {
        margin-bottom: 10px;
    }

    .input-wrapper input {
        height: 38px;
    }

    .forgot-row {
        margin-bottom: 10px;
    }

    .signin-btn {
        min-height: 39px;
    }

    .divider {
        margin: 10px 0;
    }

    .social-btn {
        height: 34px;
    }

    .signup-text {
        margin-top: 10px;
    }
}

/* ACCESSIBILITY */

button:focus-visible,
a:focus-visible,
input:focus-visible {
    outline: 2px solid var(--primary-color);
    outline-offset: 3px;
}
</style>
</head>

<body>

<!-- TOP CONTROLS -->

<div class="top-controls">
    <button class="control-btn" id="themeToggle" type="button">
        <i class="fa-solid fa-moon"></i>
        <span>Dark</span>
    </button>

    <button class="control-btn" id="rtlToggle" type="button">
        <i class="fa-solid fa-globe"></i>
        <span>RTL</span>
    </button>
</div>

<!-- LOGIN SECTION -->

<main class="login-section">

    <section class="login-card">

        <!-- SECUREFENCE LOGO -->

        <div class="brand">
            <div class="brand-logo">
                <img
                    src="Securelogo-removebg-preview.png"
                    alt="SecureFence Logo"
                >
            </div>

            <p>SECUUREFENCE</p>
        </div>

        <!-- HEADING -->

        <div class="login-heading">
            <h1>Welcome Back</h1>
            <p>Sign in to continue to your account</p>
        </div>

        <!-- LOGIN FORM -->

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <div class="input-wrapper">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="forgot-row">
                <a href="forgot-password.html">Forgot password?</a>
            </div>

            <button type="submit" class="signin-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In
            </button>

        </form>

        <!-- DIVIDER -->

        <div class="divider">
            <span>Or continue with</span>
        </div>

        <!-- SOCIAL LOGIN -->

        <div class="social-login">
            <button type="button" class="social-btn" id="googleLogin">
                <i class="fa-brands fa-google google-icon"></i>
                Google
            </button>

            <button type="button" class="social-btn" id="appleLogin">
                <i class="fa-brands fa-apple apple-icon"></i>
                Apple
            </button>
        </div>

        <!-- SIGN UP -->

        <div class="signup-text">
            Don't have an account?
            <a href="signup.html">Sign up free</a>
        </div>

    </section>
</main>

<!-- JAVASCRIPT -->

<script>
/* SHOW / HIDE PASSWORD */

const passwordInput = document.getElementById("password");
const passwordToggle = document.getElementById("passwordToggle");

passwordToggle.addEventListener("click", function () {
    const showPassword = passwordInput.type === "password";

    passwordInput.type = showPassword ? "text" : "password";

    this.innerHTML = showPassword
        ? '<i class="fa-solid fa-eye-slash"></i>'
        : '<i class="fa-solid fa-eye"></i>';

    this.setAttribute(
        "aria-label",
        showPassword ? "Hide password" : "Show password"
    );

    this.setAttribute("aria-pressed", String(showPassword));
});

/* DARK / LIGHT MODE */

document.getElementById("themeToggle").addEventListener("click", function () {
    const root = document.documentElement;
    const isDark = root.getAttribute("data-theme") === "dark";

    root.setAttribute("data-theme", isDark ? "light" : "dark");

    this.innerHTML = isDark
        ? '<i class="fa-solid fa-moon"></i><span>Dark</span>'
        : '<i class="fa-solid fa-sun"></i><span>Light</span>';
});

/* RTL / LTR MODE */

document.getElementById("rtlToggle").addEventListener("click", function () {
    const root = document.documentElement;
    const isRTL = root.getAttribute("dir") === "rtl";

    root.setAttribute("dir", isRTL ? "ltr" : "rtl");

    this.innerHTML = isRTL
        ? '<i class="fa-solid fa-globe"></i><span>RTL</span>'
        : '<i class="fa-solid fa-globe"></i><span>LTR</span>';
});

/* LOGIN FORM */

document.getElementById("loginForm").addEventListener("submit", function (event) {
    event.preventDefault();

    if (!this.reportValidity()) {
        return;
    }

    alert(
        "Form validation successful. Connect your backend to authenticate the user."
    );
});

/* GOOGLE LOGIN DEMO */

document.getElementById("googleLogin").addEventListener("click", function () {
    alert("Google login requires OAuth integration.");
});

/* APPLE LOGIN DEMO */

document.getElementById("appleLogin").addEventListener("click", function () {
    alert("Apple login requires authentication integration.");
});
</script>

</body>
</html>
